<!doctype html>
<html lang="en">
  <body
    style="
      margin: 0;
      background: #0e1322;
      color: #f8f3e8;
      font-family: Arial, sans-serif;
      padding: 32px;
    "
  >
    <div
      style="
        max-width: 480px;
        margin: auto;
        background: #1b2435;
        border-radius: 18px;
        padding: 28px;
      "
    >
      <p style="color: #ffcc66; font-size: 12px; letter-spacing: 2px">LUDO CLUB</p>
      <h1 style="font-size: 26px">Reset your password</h1>
      <p>Use the button below to choose a new password.</p>
      <p>
        <a
          href="{{ .ConfirmationURL }}"
          style="
            display: inline-block;
            background: #ffcc66;
            color: #251b13;
            padding: 14px 22px;
            border-radius: 10px;
            text-decoration: none;
          "
          >Reset password</a
        >
      </p>
      <p>Or enter this code on the app's password reset screen:</p>
      <p style="font-size: 32px; font-weight: bold; letter-spacing: 6px">{{ .Token }}</p>
      <p>
        Do not share this code. If you did not request a password reset, ignore this email. Your
        password stays unchanged.
      </p>
    </div>
  </body>
</html>
