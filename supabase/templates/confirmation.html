<!doctype html>
<html lang="en">
  <body
    style="
      margin: 0;
      background: #0e1322;
      color: #f8f3e8;
      font-family: Arial, sans-serif;
      padding: 32px;
    "
  >
    <div
      style="
        max-width: 480px;
        margin: auto;
        background: #1b2435;
        border-radius: 18px;
        padding: 28px;
      "
    >
      <p style="color: #ffcc66; font-size: 12px; letter-spacing: 2px">LUDO CLUB</p>
      <h1 style="font-size: 26px">Confirm your email</h1>
      <p>Welcome to the table. Confirm your email to finish creating your account.</p>
      <p>
        <a
          href="{{ .ConfirmationURL }}"
          style="
            display: inline-block;
            background: #ffcc66;
            color: #251b13;
            padding: 14px 22px;
            border-radius: 10px;
            text-decoration: none;
          "
          >Confirm email</a
        >
      </p>
      <p>Or enter this code in the app:</p>
      <p style="font-size: 32px; font-weight: bold; letter-spacing: 6px">{{ .Token }}</p>
      <p>This code is for you only. If you did not create an account, ignore this email.</p>
    </div>
  </body>
</html>
