# Builds apps on GitHub's own runners (free for this public repository; no
# EAS builds used) and publishes each APK behind a permanent download link:
#
#   https://github.com/<owner>/<repo>/releases/download/<app>-latest/<app>.apk
#
# Send that link to anyone with an Android phone. Every build also keeps a
# numbered release (<app>-b<run>) with the APK and, when the release keystore
# is set up, the .aab for Google Play.
#
# Runs:
#   * Actions → Build APK → Run workflow: pick an app (or "all"), and whether
#     it is a store build (real ad ids required, .aab produced).
#   * On merge to main: the changed apps that are listed in the BUILD_APPS
#     repository variable ("diya,kolam" or "all"; empty = none).
#
# Signing: secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD (docs/DEPLOY.md). Without them the
# APK is signed with the debug key: fine for testing, rejected by Play.
name: Build APK

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App to build'
        required: true
        type: choice
        default: diya
        # One entry per folder under apps/ (add new apps here too).
        options:
          - ludo
          - baghchal
          - quietatlas
          - tambola
          - akshar
          - utsav
          - speaklocal
          - diya
          - kolam
          - chaisort
          - monsoon
          - all
      store:
        description: 'Store build: refuse test ad ids and also produce the .aab'
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}-${{ inputs.app || 'push' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.pick.outputs.apps }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: pick
        env:
          BUILD_APPS: ${{ vars.BUILD_APPS }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/ci/changed-apps.mjs "" "${{ github.sha }}" "${{ inputs.app }}" >> "$GITHUB_OUTPUT"
          else
            node scripts/ci/changed-apps.mjs "${{ github.event.before }}" "${{ github.sha }}" > changed.txt
            changed=$(cut -d= -f2- changed.txt)
            # Keep only the changed apps that are switched on for automatic builds.
            apps=$(node -e '
              const changed = JSON.parse(process.argv[1]);
              const allowed = (process.env.BUILD_APPS || "").split(",").map((s) => s.trim()).filter(Boolean);
              const all = allowed.includes("all");
              console.log(JSON.stringify(changed.filter((a) => all || allowed.includes(a))));
            ' "$changed")
            echo "apps=$apps" >> "$GITHUB_OUTPUT"
          fi
          echo "Apps to build: $(grep '^apps=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: plan
    if: needs.plan.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    env:
      APP: ${{ matrix.app }}
      STORE_BUILD: ${{ inputs.store == true && 'true' || 'false' }}
      # Per-app secrets, looked up by name: SUPABASE_URL_LUDO, SUPABASE_ANON_KEY_LUDO, …
      # (secret names are case-insensitive). Only Ludo and Bagh-Chal use them.
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets[format('SUPABASE_URL_{0}', matrix.app)] }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets[format('SUPABASE_ANON_KEY_{0}', matrix.app)] }}
      ADMOB_ANDROID_APP_ID: ${{ secrets[format('ADMOB_ANDROID_APP_ID_{0}', matrix.app)] }}
      EXPO_PUBLIC_ADMOB_REWARDED_ID: ${{ secrets[format('ADMOB_REWARDED_ID_{0}', matrix.app)] }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci

      - name: Generate the Android project
        working-directory: apps/${{ matrix.app }}
        env:
          # A store build must not ship Google's test ad ids (app.config.ts refuses).
          EAS_BUILD_PROFILE: ${{ inputs.store == true && 'production' || 'preview' }}
        run: npx expo prebuild --platform android --no-install

      - name: Release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "path=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"
            echo "signed=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=${{ matrix.app }}::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with the debug key (testing only). See docs/DEPLOY.md."
            echo "signed=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Version and signing
        working-directory: apps/${{ matrix.app }}
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          # One APK per CPU type: about half the download of a fat APK.
          ANDROID_ABI_SPLITS: 'true'
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node ../../scripts/ci/android-release.mjs

      - name: Build the APK
        working-directory: apps/${{ matrix.app }}/android
        # Phones are ARM; leaving out x86 halves the download for testers.
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a --no-daemon

      - name: Build the .aab for Google Play
        if: steps.keystore.outputs.signed == 'release' && inputs.store == true
        working-directory: apps/${{ matrix.app }}/android
        run: ./gradlew :app:bundleRelease --no-daemon

      - name: Collect files
        id: files
        working-directory: apps/${{ matrix.app }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          # <app>.apk is for today's phones (64-bit ARM); <app>-arm32.apk for old 32-bit ones.
          cp android/app/build/outputs/apk/release/app-arm64-v8a-release.apk "$RUNNER_TEMP/out/$APP.apk"
          cp android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk "$RUNNER_TEMP/out/$APP-arm32.apk"
          [ -f android/app/build/outputs/bundle/release/app-release.aab ] && cp android/app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/out/$APP.aab"
          version=$(node -p "require('./app.json').expo.version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          ls -la "$RUNNER_TEMP/out"

      - name: Publish the download link
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.files.outputs.version }}
          SIGNED: ${{ steps.keystore.outputs.signed }}
        run: |
          set -e
          run_tag="$APP-b${{ github.run_number }}"
          latest_tag="$APP-latest"
          link="https://github.com/${{ github.repository }}/releases/download/$latest_tag/$APP.apk"
          notes=$(cat <<EOF
          **$APP** version $VERSION, build ${{ github.run_number }}, from commit ${GITHUB_SHA::7}.
          Signed with the **$SIGNED** key$([ "$SIGNED" = debug ] && echo " (testing only; not for Google Play)").

          Permanent link to the newest build: $link
          (Phones from before about 2016 with a 32-bit chip need \`$APP-arm32.apk\` from the same release.)
          EOF
          )
          # The numbered release keeps every build; the "latest" release is
          # re-created each time so its link never changes.
          gh release create "$run_tag" "$RUNNER_TEMP"/out/* --title "$APP $VERSION (build ${{ github.run_number }})" --notes "$notes" --target "$GITHUB_SHA"
          gh release delete "$latest_tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$latest_tag" "$RUNNER_TEMP/out/$APP.apk" "$RUNNER_TEMP/out/$APP-arm32.apk" --title "$APP — latest build" --notes "$notes" --target "$GITHUB_SHA" --latest=false
          {
            echo "### $APP $VERSION (build ${{ github.run_number }}) — signed with the $SIGNED key"
            echo
            echo "Download link to share: $link"
          } >> "$GITHUB_STEP_SUMMARY"
