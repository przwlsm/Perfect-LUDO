# Continuous deployment of every app in apps/ with EAS.
#
# On every push to main (or an app-dev* branch) it works out which apps the
# push changed (scripts/ci/changed-apps.mjs), checks them, then for each one:
#   * JavaScript or asset changes ship as an over-the-air update: installed
#     phones pick it up when the app is next opened (each app waits up to
#     3 s at launch for it; on a slow network, the launch after).
#   * Changes that alter native code (a new native library, app.json plugins,
#     an SDK upgrade) change the app's fingerprint: the update is still
#     published but no installed app matches it, so nothing changes on phones
#     until a new binary goes out. Binaries come from the Build APK workflow
#     (GitHub's free runners), never from EAS Build, so this workflow spends
#     no Expo build quota: it only runs `eas update`.
#
# Branches:
#   main     -> EAS channel "production" (store and download-link installs)
#   app-dev* -> EAS channel "preview" (internal testers)
#
# An app ships only when it is in the DEPLOY_APPS repository variable
# (comma-separated or "all"; empty = none), is linked to EAS (a project id
# in its app.json; run scripts/eas-link-apps.mjs), and the EXPO_TOKEN
# secret exists. Otherwise it is checked and skipped with a notice, never
# failed. Setup: docs/DEPLOY.md.
name: Deploy

on:
  push:
    branches: [main, 'app-dev*']
  workflow_dispatch:
    inputs:
      app:
        description: 'App to publish over the air'
        required: true
        type: choice
        default: all
        # One entry per folder under apps/ (add new apps here too).
        options:
          - all
          - ludo
          - baghchal
          - quietatlas
          - tambola
          - akshar
          - utsav
          - speaklocal
          - diya
          - kolam
          - chaisort
          - monsoon

permissions:
  contents: read

concurrency:
  # One deploy per branch at a time; a newer push waits rather than cutting
  # an update off half-published.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.pick.outputs.apps }}
      filters: ${{ steps.pick.outputs.filters }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: pick
        run: |
          node scripts/ci/changed-apps.mjs "${{ github.event.before }}" "${{ github.sha }}" "${{ inputs.app }}" >> "$GITHUB_OUTPUT"
          apps=$(grep '^apps=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)
          echo "filters=$(node -e "console.log(JSON.parse(process.argv[1]).map(a=>'--filter='+a).join(' '))" "$apps")" >> "$GITHUB_OUTPUT"
          echo "Apps to deploy: $apps" >> "$GITHUB_STEP_SUMMARY"

  check:
    needs: plan
    if: needs.plan.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck, lint and tests (changed apps and what they use)
        run: npx turbo run typecheck lint test ${{ needs.plan.outputs.filters }}
      - name: Ludo database rules
        if: contains(fromJSON(needs.plan.outputs.apps), 'ludo')
        run: npm run test:online --workspace ludo
      - name: Bagh-Chal database rules
        if: contains(fromJSON(needs.plan.outputs.apps), 'baghchal')
        run: npm run test:online --workspace baghchal

  deploy:
    needs: [plan, check]
    if: needs.plan.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # main is the store; every other deploy branch is internal testing.
      TARGET: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
      # Repository variable (Settings → Secrets and variables → Actions →
      # Variables): the apps allowed to ship, comma-separated (e.g.
      # "diya,kolam"), or "all". Empty means none, so a merge never publishes
      # to an app whose first release has not been set up yet.
      DEPLOY_APPS: ${{ vars.DEPLOY_APPS }}
      # The update's JavaScript is bundled here, so it needs the same per-app
      # values as a build (same secret names as build-apk.yml).
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets[format('SUPABASE_URL_{0}', matrix.app)] }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets[format('SUPABASE_ANON_KEY_{0}', matrix.app)] }}
      EXPO_PUBLIC_ADMOB_REWARDED_ID: ${{ secrets[format('ADMOB_REWARDED_ID_{0}', matrix.app)] }}
    steps:
      - uses: actions/checkout@v7
      - name: Is ${{ matrix.app }} ready to deploy?
        id: ready
        run: |
          # Linked = has an EAS project id; updates.url is in app.json or, like
          # Ludo, derived from the id by app.config.ts.
          linked=$(node -e "const fs=require('fs');const d='./apps/${{ matrix.app }}/';const e=require(d+'app.json').expo;const derived=fs.existsSync(d+'app.config.ts')&&fs.readFileSync(d+'app.config.ts','utf8').includes('u.expo.dev');console.log(Boolean(e.extra?.eas?.projectId&&(e.updates?.url||derived)))")
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::notice title=${{ matrix.app }}::EXPO_TOKEN secret is not set, so nothing was deployed. See docs/DEPLOY.md."
            echo "go=false" >> "$GITHUB_OUTPUT"
          elif [ "$linked" != "true" ]; then
            echo "::notice title=${{ matrix.app }}::Not linked to EAS yet (run scripts/eas-link-apps.mjs ${{ matrix.app }}), so it was skipped."
            echo "go=false" >> "$GITHUB_OUTPUT"
          elif [ "$DEPLOY_APPS" != "all" ] && [[ ",${DEPLOY_APPS// /}," != *",${{ matrix.app }},"* ]]; then
            echo "::notice title=${{ matrix.app }}::Not in the DEPLOY_APPS repository variable, so it was checked but not shipped. See docs/DEPLOY.md."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.ready.outputs.go == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.ready.outputs.go == 'true'
        run: npm ci
      - uses: expo/expo-github-action@v9
        if: steps.ready.outputs.go == 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      # Update only, never a build. The channel is created on first use;
      # creating it again is a harmless error. iOS joins once there is an
      # Apple developer account (platform: all).
      - name: Publish ${{ matrix.app }} over the air
        if: steps.ready.outputs.go == 'true'
        working-directory: apps/${{ matrix.app }}
        run: |
          eas channel:create "$TARGET" --non-interactive >/dev/null 2>&1 || true
          eas update --channel "$TARGET" --platform android --non-interactive --json \
            --message "${COMMIT_MESSAGE:0:120}" > update.json
          node -e '
            const u = JSON.parse(require("fs").readFileSync("update.json", "utf8"))[0] ?? {};
            console.log(`### ${process.env.APP}: update published to "${process.env.TARGET}"`);
            console.log(`runtime version (fingerprint) ${u.runtimeVersion ?? "?"}, group ${u.group ?? "?"}`);
            console.log("Installed apps with this native fingerprint get it on their next launch. If native code changed, run Build APK (store) and upload the new binary first.");
          ' >> "$GITHUB_STEP_SUMMARY"
        env:
          APP: ${{ matrix.app }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'Manual deploy' }}
