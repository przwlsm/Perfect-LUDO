# Checks every change before it can reach main (make "CI" a required check
# for main in GitHub → Settings → Branches; see docs/DEPLOY.md).
#
#   verify: lint, typecheck and tests for every app and package (Turborepo
#           skips what did not change), the server-rule parity tests of Ludo
#           and Bagh-Chal, and a dependency audit.
#   bundle: the apps a change touched are bundled for Android exactly as a
#           release would be, so an import that only breaks on a phone (a
#           web-only module, a missing asset) fails here, not on a device.
name: CI

on:
  pull_request:
    branches: [main, 'app-dev*']
  push:
    branches: [main, 'app-dev*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Workflow app dropdowns list every app
        run: node scripts/ci/check-app-lists.mjs
      - name: Lint, typecheck and test every app and package
        run: npx turbo run lint typecheck test
      - name: Ludo database rules and RPC integrity
        run: npm run test:online --workspace ludo
      - name: Bagh-Chal database rules and RPC integrity
        run: npm run test:online --workspace baghchal
      # A critical advisory in what ships to users (production dependencies)
      # blocks the merge. Everything else is reported as a warning: as of
      # 2026-10-16 the high ones left (braces, node-forge) live in build
      # tooling and are flagged for every published version, so no fix exists
      # yet, and handlebars is pinned to 4.7.9 by the ESLint boundaries
      # plugin (lint time only). Fixed ones are pinned with "overrides" in the
      # root package.json.
      - name: Audit shipped dependencies (critical blocks)
        run: npm audit --omit=dev --audit-level=critical
      - name: Audit report (all, informational)
        run: npm audit --audit-level=high || echo "::warning title=npm audit::Advisories without a published fix remain in build tooling; run npm audit for details."

  plan:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.pick.outputs.apps }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: pick
        run: >
          node scripts/ci/changed-apps.mjs
          "${{ github.event.pull_request.base.sha || github.event.before }}"
          "${{ github.event.pull_request.head.sha || github.sha }}"
          >> "$GITHUB_OUTPUT"

  bundle:
    needs: plan
    if: needs.plan.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bundle ${{ matrix.app }} for Android
        working-directory: apps/${{ matrix.app }}
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/bundle-${{ matrix.app }}"
