name: CI

on:
  push:
    branches: [main, Dev]
  pull_request:
    branches: [main, Dev]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Every app and package: Turborepo skips the ones whose files did not change.
      - name: Lint, typecheck and test
        run: npx turbo run lint typecheck test

      - name: Ludo database rules and RPC integrity
        run: npm run test:online --workspace ludo

      - name: Bagh-Chal database rules and RPC integrity
        run: npm run test:online --workspace baghchal

      - name: Export Ludo for all platforms
        run: npm run export:all --workspace ludo

      - name: Audit dependencies
        run: npm audit --audit-level=high
